version: "3.9"

# ---------------------------------------------------------------------------- #
#  Plato's Core — self-hosted stack                                             #
#  Requires: Docker 24+, Docker Compose v2                                     #
#                                                                               #
#  Before starting:                                                             #
#    cp deploy/.env.example deploy/.env                                        #
#    # fill in all values in deploy/.env                                       #
#    docker compose -f deploy/docker-compose.yml up -d                         #
# ---------------------------------------------------------------------------- #

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────── #
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-platos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-platos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Schema migration (runs once, exits) ─────────────────────────────────── #
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-platos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-platos}
    command: >
      sh -c "
        cd /app &&
        npx drizzle-kit push --config lib/db/drizzle.config.ts
      "

  # ── API + job runner ─────────────────────────────────────────────────────── #
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV:               production
      PORT:                   "8080"
      DATABASE_URL:           postgresql://${POSTGRES_USER:-platos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-platos}
      SESSION_SECRET:         ${SESSION_SECRET}
      OPENAI_API_KEY:         ${OPENAI_API_KEY}
      RESEND_API_KEY:         ${RESEND_API_KEY}
      APP_URL:                ${APP_URL}
      ADMIN_EMAILS:           ${ADMIN_EMAILS}
      ADMIN_SLACK_WEBHOOK_URL: ${ADMIN_SLACK_WEBHOOK_URL:-}
      CLERK_SECRET_KEY:       ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY:  ${CLERK_PUBLISHABLE_KEY}
      # Job runner tuning (optional)
      JOB_RUNNER_INTERVAL_MS:  ${JOB_RUNNER_INTERVAL_MS:-60000}
      JOB_RUNNER_CONCURRENCY:  ${JOB_RUNNER_CONCURRENCY:-3}
      ENABLE_PLAYWRIGHT:       ${ENABLE_PLAYWRIGHT:-false}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend (nginx serving static build + reverse proxy to api) ─────────── #
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        PORT:      "3000"
        BASE_PATH: "/"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  pgdata:
