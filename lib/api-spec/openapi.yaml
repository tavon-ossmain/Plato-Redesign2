openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Plato's Core — Signal Command Center API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workspaces
    description: Workspace operations
  - name: pipeline
    description: Signal pipeline operations
  - name: feedback
    description: Signal feedback operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List workspaces
      responses:
        "200":
          description: List of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"

  /workspaces/{workspaceId}/dashboard:
    get:
      operationId: getWorkspaceDashboard
      tags: [workspaces]
      summary: Get workspace dashboard stats and source health
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "404":
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workspaces/{workspaceId}/pipeline:
    get:
      operationId: getWorkspacePipeline
      tags: [pipeline]
      summary: Get signals pipeline for a workspace
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signal"
        "404":
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workspaces/{workspaceId}/opportunities/{opportunityId}/assign:
    post:
      operationId: assignOpportunity
      tags: [pipeline]
      summary: Route a signal to an owner
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: opportunityId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignInput"
      responses:
        "200":
          description: Signal assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signal"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workspaces/{workspaceId}/opportunities/{opportunityId}/outreach:
    post:
      operationId: startOutreach
      tags: [pipeline]
      summary: Queue approved outreach for a signal
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: opportunityId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Outreach queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signal"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Signal cannot start outreach
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /feedback:
    post:
      operationId: submitFeedback
      tags: [feedback]
      summary: Submit feedback for a signal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signal"
        "404":
          description: Signal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Workspace:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        plan:
          type: string
        quota:
          type: integer
        used:
          type: integer
        primaryCrm:
          type: string
        deliveryMode:
          type: string
      required:
        - id
        - name
        - plan
        - quota
        - used
        - primaryCrm
        - deliveryMode

    SourceHealth:
      type: object
      properties:
        name:
          type: string
        yield:
          type: integer
        status:
          type: string
        mode:
          type: string
        scanned:
          type: integer
        accepted:
          type: integer
        duplicates:
          type: integer
        stale:
          type: integer
      required:
        - name
        - yield
        - status
        - mode
        - scanned
        - accepted
        - duplicates
        - stale

    CostGuard:
      type: object
      properties:
        status:
          type: string
        defaultModel:
          type: string
        escalationModel:
          type: string
        weeklyBudgetUsd:
          type: number
        spentUsd:
          type: number
        degradedAction:
          type: string
      required:
        - status
        - defaultModel
        - escalationModel
        - weeklyBudgetUsd
        - spentUsd
        - degradedAction

    Dashboard:
      type: object
      properties:
        rawScanned:
          type: integer
        uniqueAccounts:
          type: integer
        duplicatesSuppressed:
          type: integer
        staleSignals:
          type: integer
        billableOpportunities:
          type: integer
        intentUpdates:
          type: integer
        quota:
          type: integer
        used:
          type: integer
        deliveredToday:
          type: integer
        weeklyTargetMin:
          type: integer
        weeklyTargetMax:
          type: integer
        rolledOver:
          type: integer
        noLeadReason:
          type: ["string", "null"]
        workspaceName:
          type: string
        primaryCrm:
          type: string
        deliveryMode:
          type: string
        costGuard:
          $ref: "#/components/schemas/CostGuard"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceHealth"
      required:
        - rawScanned
        - uniqueAccounts
        - duplicatesSuppressed
        - staleSignals
        - billableOpportunities
        - intentUpdates
        - quota
        - used
        - deliveredToday
        - weeklyTargetMin
        - weeklyTargetMax
        - rolledOver
        - noLeadReason
        - costGuard
        - sources

    Contact:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        linkedin:
          type: string
      required:
        - name
        - title
        - linkedin

    Signal:
      type: object
      properties:
        id:
          type: string
        company:
          type: string
        accountDomain:
          type: string
        contact:
          $ref: "#/components/schemas/Contact"
        source:
          type: string
        sourcePlatform:
          type: string
        sourceUrl:
          type: string
        evidenceSnippet:
          type: string
        whyNow:
          type: string
        fitScore:
          type: integer
        confidenceScore:
          type: integer
        freshnessScore:
          type: integer
        seenAt:
          type: string
        lastVerifiedAt:
          type: string
        disposition:
          type: string
        billingReason:
          type: string
        recommendedChannel:
          type: string
        owner:
          type: string
        route:
          type: string
        actionStatus:
          type: string
        crmStatus:
          type: string
        crmRecordId:
          type: ["string", "null"]
        dedupeStatus:
          type: string
        duplicateOf:
          type: ["string", "null"]
        territory:
          type: string
        modelPath:
          type: string
        modelTier:
          type: string
        rawSource:
          type: string
        nextAction:
          type: string
        outreachDraft:
          type: string
        feedback:
          type: ["string", "null"]
      required:
        - id
        - company
        - accountDomain
        - contact
        - source
        - sourcePlatform
        - sourceUrl
        - evidenceSnippet
        - whyNow
        - fitScore
        - confidenceScore
        - freshnessScore
        - seenAt
        - lastVerifiedAt
        - disposition
        - billingReason
        - recommendedChannel
        - owner
        - route
        - actionStatus
        - crmStatus
        - crmRecordId
        - dedupeStatus
        - duplicateOf
        - territory
        - modelPath
        - modelTier
        - rawSource
        - nextAction
        - outreachDraft

    AssignInput:
      type: object
      properties:
        owner:
          type: string
      required:
        - owner

    FeedbackInput:
      type: object
      properties:
        signalId:
          type: string
        workspaceId:
          type: string
        feedback:
          type: string
      required:
        - signalId
        - workspaceId
        - feedback
